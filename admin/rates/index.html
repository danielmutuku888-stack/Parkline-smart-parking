<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parking Rates · Parkline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <div id="shared-header"></div><div id="shared-nav"></div>
     <div class="page-content">
    <section class="intro page-intro"><div><p class="eyebrow">Administration / Configuration</p><h1>Parking<br><em>rates.</em></h1><p class="subhead">Configure the fee charged for each parking duration.</p></div></section>
    <nav class="admin-tabs" aria-label="Admin pages"><a href="/admin/history">Checkout History</a><a class="active" href="/admin/rates" aria-current="page">Parking Rates</a></nav>
    <section class="panel rate-page-panel">
      <div class="panel-title"><div><p class="eyebrow">Administration</p><h2>Rate tiers</h2></div><span class="tag">KES</span></div>
      <form id="rate-form">
        <section class="rate-type-group" aria-labelledby="car-rates-heading">
          <h3 id="car-rates-heading">Cars</h3>
          <div class="rate-grid">
            <label>Up to 30 min <span>KES</span><input type="number" name="rate-car-0" min="0" step="0.01" required></label>
            <label>31-120 min <span>KES</span><input type="number" name="rate-car-1" min="0" step="0.01" required></label>
            <label>121-240 min <span>KES</span><input type="number" name="rate-car-2" min="0" step="0.01" required></label>
            <label>241-360 min <span>KES</span><input type="number" name="rate-car-3" min="0" step="0.01" required></label>
            <label>Over 360 min <span>KES</span><input type="number" name="rate-car-4" min="0" step="0.01" required></label>
          </div>
        </section>
        <section class="rate-type-group" aria-labelledby="motorcycle-rates-heading">
          <h3 id="motorcycle-rates-heading">Motorcycles</h3>
          <div class="rate-grid">
            <label>Up to 30 min <span>KES</span><input type="number" name="rate-motorcycle-0" min="0" step="0.01" required></label>
            <label>31-120 min <span>KES</span><input type="number" name="rate-motorcycle-1" min="0" step="0.01" required></label>
            <label>121-240 min <span>KES</span><input type="number" name="rate-motorcycle-2" min="0" step="0.01" required></label>
            <label>241-360 min <span>KES</span><input type="number" name="rate-motorcycle-3" min="0" step="0.01" required></label>
            <label>Over 360 min <span>KES</span><input type="number" name="rate-motorcycle-4" min="0" step="0.01" required></label>
          </div>
        </section>
        <section class="rate-type-group" aria-labelledby="truck-rates-heading">
          <h3 id="truck-rates-heading">Trucks</h3>
          <div class="rate-grid">
            <label>Up to 30 min <span>KES</span><input type="number" name="rate-truck-0" min="0" step="0.01" required></label>
            <label>31-120 min <span>KES</span><input type="number" name="rate-truck-1" min="0" step="0.01" required></label>
            <label>121-240 min <span>KES</span><input type="number" name="rate-truck-2" min="0" step="0.01" required></label>
            <label>241-360 min <span>KES</span><input type="number" name="rate-truck-3" min="0" step="0.01" required></label>
            <label>Over 360 min <span>KES</span><input type="number" name="rate-truck-4" min="0" step="0.01" required></label>
          </div>
        </section>
        <button class="secondary-button" type="submit">Save rates</button>
      </form>
      <p id="rate-feedback" class="feedback" role="status" aria-live="polite"></p>
    </section>
    <nav class="admin-tabs admin-tabs-secondary" aria-label="Other admin page"><a href="/admin/history">Checkout History →</a></nav>
    <div id="shared-footer"></div>
    </div>
  </main>
  <script src="/app.js"></script>
</body>
</html>
